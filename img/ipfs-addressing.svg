<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<text x="40" y="34" font-size="15" font-weight="500" fill="#2C2C2A">HTTP · 地址寻址</text>
<text x="40" y="54" font-size="12" fill="#5F5E5A">问"去哪台服务器拿"——服务器下线就失效</text>

<rect x="40" y="72" width="150" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="115" y="98" font-size="14" font-weight="500" text-anchor="middle" fill="#0C447C">客户端</text>
<text x="115" y="116" font-size="12" text-anchor="middle" fill="#185FA5">example.com/cat.jpg</text>

<line x1="190" y1="100" x2="288" y2="100" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="290" y="72" width="150" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="365" y="98" font-size="14" font-weight="500" text-anchor="middle" fill="#2C2C2A">指定服务器</text>
<text x="365" y="116" font-size="12" text-anchor="middle" fill="#444441">唯一来源</text>

<rect x="490" y="72" width="150" height="56" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text x="565" y="98" font-size="14" font-weight="500" text-anchor="middle" fill="#791F1F">服务器下线</text>
<text x="565" y="116" font-size="12" text-anchor="middle" fill="#A32D2D">链接失效</text>

<line x1="440" y1="100" x2="488" y2="100" stroke="#A32D2D" stroke-width="1.5" marker-end="url(#arrow)"/>

<line x1="40" y1="160" x2="640" y2="160" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 4"/>

<text x="40" y="196" font-size="15" font-weight="500" fill="#2C2C2A">IPFS · 内容寻址</text>
<text x="40" y="216" font-size="12" fill="#5F5E5A">问"我要这份内容"——任何持有者都能提供</text>

<rect x="40" y="234" width="150" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="115" y="260" font-size="14" font-weight="500" text-anchor="middle" fill="#085041">客户端</text>
<text x="115" y="278" font-size="12" text-anchor="middle" fill="#0F6E56">请求 CID: Qm…</text>

<line x1="190" y1="262" x2="288" y2="262" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="290" y="234" width="160" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="370" y="260" font-size="14" font-weight="500" text-anchor="middle" fill="#3C3489">DHT 网络</text>
<text x="370" y="278" font-size="12" text-anchor="middle" fill="#534AB7">查谁持有该内容</text>

<rect x="500" y="208" width="140" height="40" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="570" y="228" font-size="14" text-anchor="middle" fill="#085041" dominant-baseline="central">节点 A</text>
<rect x="500" y="256" width="140" height="40" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="570" y="276" font-size="14" text-anchor="middle" fill="#085041" dominant-baseline="central">节点 B</text>
<rect x="500" y="304" width="140" height="40" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="570" y="324" font-size="14" text-anchor="middle" fill="#085041" dominant-baseline="central">节点 C</text>

<line x1="450" y1="250" x2="498" y2="228" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="450" y1="262" x2="498" y2="276" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="450" y1="274" x2="498" y2="324" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arrow)"/>

<text x="340" y="392" font-size="12" text-anchor="middle" fill="#5F5E5A">内容由哈希指纹 CID 标识，多个节点冗余持有，单点下线不影响可取</text>
</svg>
